[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build 2>/dev/null || true"

[deploy]
startCommand = "node server.js"
restartPolicyMaxRetries = 5
restartPolicyWindow = 600

[[services]]
name = "Backend"
rootDirectory = "my-app/backend"
nixpacksConfig = """
[nodejs]
nodeVersion = "18"
"""

[services.env]
PORT = "5000"
NODE_ENV = "production"

[services.domains]
[[services.domains.domain]]
domain = ""
