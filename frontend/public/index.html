<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ Content Security Policy (FIXED FOR LOCAL + NETWORK + PRODUCTION) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        connect-src 'self'
          http://localhost:* 
          http://127.0.0.1:* 
          http://192.168.8.1:*
          http://192.168.100.198:*
          https://fyp-part-1-production.up.railway.app
          ws://localhost:* 
          ws://127.0.0.1:* 
          ws://192.168.8.1:*
          wss://192.168.100.198:*
          wss://fyp-part-1-production.up.railway.app;
      "
    />

    <!-- Favicon - Changed from React logo to Riphah logo -->
    <link rel="icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#003366" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Title -->
    <title>
      Riphah E Clearance | Smart & Secure Clearance System
    </title>

    <!-- SEO -->
    <meta
      name="description"
      content="Riphah Student Clearance Portal – A smart, secure and paperless system for students to manage and track their department-wise clearance digitally."
    />
    <meta
      name="keywords"
      content="Riphah, Clearance System, Student Portal, University Clearance, Smart Clearance, Barcode Clearance"
    />
    <meta name="author" content="Riphah International University" />

    <!-- Open Graph -->
    <meta property="og:title" content="Riphah E Clearance" />
    <meta
      property="og:description"
      content="A fully digitized platform for student clearance, department approvals, barcode verification and secure submission."
    />
    <meta property="og:image" content="%PUBLIC_URL%/RiphahPng.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://riphah-clearance-portal.com" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/RiphahPng.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <!-- Loading Screen -->
      <div
        id="app-loading"
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          font-family: 'Inter', sans-serif;
          color: #003366;
          background: #f8f9fc;
        "
      >
        <div style="text-align: center">
          <div
            style="
              width: 40px;
              height: 40px;
              border: 4px solid #ddd;
              border-top: 4px solid #003366;
              border-radius: 50%;
              animation: spin 1s linear infinite;
              margin: auto;
            "
          ></div>
          <p style="margin-top: 15px; font-size: 18px">
            Loading Portal...
          </p>
        </div>
      </div>
    </div>

    <!-- Spinner Animation -->
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
