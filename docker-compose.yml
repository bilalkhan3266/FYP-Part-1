version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: fypproject-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fypproject
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fypproject-network

  # Application Server (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fypproject-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/fypproject
      JWT_SECRET: ${JWT_SECRET:-your_secret_key_change_this}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fypproject-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  fypproject-network:
    driver: bridge
